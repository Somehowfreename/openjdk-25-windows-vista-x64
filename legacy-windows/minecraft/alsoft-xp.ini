# OpenAL Soft configuration for Minecraft on Windows XP x64.
#
# XP's native DirectSound path is used explicitly. A conservative four-period
# buffer prevents the repeatable crackling observed with OpenAL Soft's default
# output configuration on bare-metal IDT HD Audio hardware.

[general]
drivers = dsound
channels = stereo
sample-type = int16
frequency = 48000
period_size = 1024
periods = 4
stereo-encoding = basic
hrtf = off
resampler = spline

