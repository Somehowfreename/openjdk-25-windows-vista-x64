name: Vista x64 compatibility report
description: Report a problem with OpenJDK 25 and the supported Minecraft 26 configurations
title: "[Vista x64] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check the release matrix. Individual mods are untested and Minecraft 26.3 mod loaders are not supported yet. Remove account data and access tokens from logs.
  - type: input
    id: installer
    attributes:
      label: Installer filename and SHA-256
      placeholder: OpenJDK25U-jdk_x64_windows-vista_25.0.4.exe
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and hardware
      description: Include service pack, CPU, RAM, GPU/audio devices, drivers and whether this is physical hardware or a VM.
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: Launcher version and selected Java executable
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Exact Minecraft and loader versions
      description: State vanilla, Fabric or NeoForge and list any installed mods.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, access tokens, account identifiers and unrelated personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I selected the Java executable named for my launcher.
          required: true
        - label: I removed private information from the attached logs.
          required: true
